server {
  listen 3001;
  server_name _;

  absolute_redirect off;
  port_in_redirect off;

  location / {
    proxy_pass http://agent-frontend:3001;
    proxy_http_version 1.1;
    proxy_set_header Host agent-frontend:3001;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Accept-Encoding "";

    sub_filter_once off;
    sub_filter_types text/html text/css application/javascript text/javascript application/json;
    sub_filter '="/_next/' '="./_next/';
    sub_filter "='/_next/" "='./_next/";
    sub_filter '"/_next/' '"./_next/';
    sub_filter "'/_next/" "'./_next/";
    sub_filter 'url(/_next/' 'url(./_next/';
    sub_filter 'href="/favicon.ico' 'href="./favicon.ico';
    sub_filter 'src="/favicon.ico' 'src="./favicon.ico';
    sub_filter '"/api/' '"./api/';
    sub_filter "'/api/" "'./api/";
  }
}
