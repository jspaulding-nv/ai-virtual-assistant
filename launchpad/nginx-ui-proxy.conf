server {
  listen 3001;
  server_name _;

  absolute_redirect off;
  port_in_redirect off;
  add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
  add_header Pragma "no-cache" always;
  add_header Expires "0" always;

  location ~ ^/(?:coder/)?proxy/3001/_next/static/css/(.*)$ {
    rewrite ^/(?:coder/)?proxy/3001/(.*)$ /$1 break;

    proxy_pass http://agent-frontend:3001;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:3001;
    proxy_set_header Accept-Encoding "";

    sub_filter_once off;
    sub_filter_types text/css;
    sub_filter 'url(/_next/static/media/' 'url(../media/';
    sub_filter 'url("./_next/static/media/' 'url("../media/';
    sub_filter "url('./_next/static/media/" "url('../media/";
    sub_filter 'url(./_next/static/media/' 'url(../media/';
    sub_filter 'url(_next/static/media/' 'url(../media/';
    sub_filter 'url("_next/static/media/' 'url("../media/';
    sub_filter "url('_next/static/media/" "url('../media/";
    sub_filter 'url("/_next/static/media/' 'url("../media/';
    sub_filter "url('/_next/static/media/" "url('../media/";
  }

  location ~ ^/_next/static/css/(.*)$ {
    proxy_pass http://agent-frontend:3001;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:3001;
    proxy_set_header Accept-Encoding "";

    sub_filter_once off;
    sub_filter_types text/css;
    sub_filter 'url(/_next/static/media/' 'url(../media/';
    sub_filter 'url("./_next/static/media/' 'url("../media/';
    sub_filter "url('./_next/static/media/" "url('../media/";
    sub_filter 'url(./_next/static/media/' 'url(../media/';
    sub_filter 'url(_next/static/media/' 'url(../media/';
    sub_filter 'url("_next/static/media/' 'url("../media/';
    sub_filter "url('_next/static/media/" "url('../media/";
    sub_filter 'url("/_next/static/media/' 'url("../media/';
    sub_filter "url('/_next/static/media/" "url('../media/";
  }

  location ~ ^/(?:coder/)?proxy/3001/?(.*)$ {
    rewrite ^/(?:coder/)?proxy/3001/?(.*)$ /$1 break;

    proxy_pass http://agent-frontend:3001;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:3001;
    proxy_set_header Accept-Encoding "";

    sub_filter_once off;
    sub_filter_types text/html text/css application/javascript text/javascript application/json;
    sub_filter '="/_next/' '="./_next/';
    sub_filter "='/_next/" "='./_next/";
    sub_filter '"/_next/' '"./_next/';
    sub_filter "'/_next/" "'./_next/";
    sub_filter "\\/_next/" ".\\/_next/";
    sub_filter 'href="/favicon.ico' 'href="./favicon.ico';
    sub_filter 'src="/favicon.ico' 'src="./favicon.ico';
    sub_filter "\\/favicon.ico" ".\\/favicon.ico";
    sub_filter '="/artifacts/' '="./artifacts/';
    sub_filter "='/artifacts/" "='./artifacts/";
    sub_filter '"/artifacts/' '"./artifacts/';
    sub_filter "'/artifacts/" "'./artifacts/";
    sub_filter "\\/artifacts/" ".\\/artifacts/";
    sub_filter 'https://assets.ngc.nvidia.com/products/' './artifacts/products/';
    sub_filter "https:\\/\\/assets.ngc.nvidia.com\\/products\\/" ".\\/artifacts\\/products\\/";
    sub_filter '="/temp_image.jpg' '="./temp_image.jpg';
    sub_filter "='/temp_image.jpg" "='./temp_image.jpg";
    sub_filter '"/temp_image.jpg' '"./temp_image.jpg';
    sub_filter "'/temp_image.jpg" "'./temp_image.jpg";
    sub_filter "\\/temp_image.jpg" ".\\/temp_image.jpg";
    sub_filter '"/api/' '"./api/';
    sub_filter "'/api/" "'./api/";
    sub_filter "\\/api/" ".\\/api/";
  }

  location / {
    proxy_pass http://agent-frontend:3001;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:3001;
    proxy_set_header Accept-Encoding "";

    sub_filter_once off;
    sub_filter_types text/html text/css application/javascript text/javascript application/json;
    sub_filter '="/_next/' '="./_next/';
    sub_filter "='/_next/" "='./_next/";
    sub_filter '"/_next/' '"./_next/';
    sub_filter "'/_next/" "'./_next/";
    sub_filter "\\/_next/" ".\\/_next/";
    sub_filter 'href="/favicon.ico' 'href="./favicon.ico';
    sub_filter 'src="/favicon.ico' 'src="./favicon.ico';
    sub_filter "\\/favicon.ico" ".\\/favicon.ico";
    sub_filter '="/artifacts/' '="./artifacts/';
    sub_filter "='/artifacts/" "='./artifacts/";
    sub_filter '"/artifacts/' '"./artifacts/';
    sub_filter "'/artifacts/" "'./artifacts/";
    sub_filter "\\/artifacts/" ".\\/artifacts/";
    sub_filter 'https://assets.ngc.nvidia.com/products/' './artifacts/products/';
    sub_filter "https:\\/\\/assets.ngc.nvidia.com\\/products\\/" ".\\/artifacts\\/products\\/";
    sub_filter '="/temp_image.jpg' '="./temp_image.jpg';
    sub_filter "='/temp_image.jpg" "='./temp_image.jpg";
    sub_filter '"/temp_image.jpg' '"./temp_image.jpg';
    sub_filter "'/temp_image.jpg" "'./temp_image.jpg";
    sub_filter "\\/temp_image.jpg" ".\\/temp_image.jpg";
    sub_filter '"/api/' '"./api/';
    sub_filter "'/api/" "'./api/";
    sub_filter "\\/api/" ".\\/api/";
  }
}
