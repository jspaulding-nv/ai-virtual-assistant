services:
  agent-frontend:
    image: ghcr.io/${GHCR_OWNER:-jspaulding-nv}/${GHCR_IMAGE_PREFIX:-aiva-customer-service}-ui:${LAUNCHPAD_UI_TAG:-nemotron3-launchpad-proxy}

  agent-chain-server:
    environment:
      APP_LLM_MODELNAME: ${APP_LLM_MODELNAME:-nvidia/nemotron-3-nano-30b-a3b}
      APP_LLM_SERVERURL: ${APP_LLM_SERVERURL:-nemollm-inference:8000}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-local-nim}
    depends_on:
      unstructured-retriever:
        condition: service_started
        required: true
      structured-retriever:
        condition: service_started
        required: true
      postgres:
        condition: service_healthy
        required: true
      redis:
        condition: service_started
        required: true
      nemollm-inference:
        condition: service_healthy
        required: true

  analytics-server:
    environment:
      APP_LLM_MODELNAME: ${APP_LLM_MODELNAME:-nvidia/nemotron-3-nano-30b-a3b}
      APP_LLM_SERVERURL: ${APP_LLM_SERVERURL:-nemollm-inference:8000}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-local-nim}
    depends_on:
      postgres:
        condition: service_healthy
        required: true
      nemollm-inference:
        condition: service_healthy
        required: true

  unstructured-retriever:
    ports: !override
      - "18086:8081"
    environment:
      APP_LLM_MODELNAME: ${APP_LLM_MODELNAME:-nvidia/nemotron-3-nano-30b-a3b}
      APP_LLM_SERVERURL: ${APP_LLM_SERVERURL:-nemollm-inference:8000}
      APP_EMBEDDINGS_MODELNAME: ${APP_EMBEDDINGS_MODELNAME:-nvidia/llama-nemotron-embed-1b-v2}
      APP_EMBEDDINGS_SERVERURL: ${APP_EMBEDDINGS_SERVERURL:-nemollm-embedding:8000}
      APP_RANKING_MODELNAME: ${APP_RANKING_MODELNAME:-nvidia/llama-nemotron-rerank-1b-v2}
      APP_RANKING_SERVERURL: ${APP_RANKING_SERVERURL:-ranking-ms:8000}
      APP_VECTORSTORE_INDEXTYPE: ${APP_VECTORSTORE_INDEXTYPE:-GPU_IVF_FLAT}
      APP_VECTORSTORE_NLIST: ${APP_VECTORSTORE_NLIST:-64}
      APP_VECTORSTORE_NPROBE: ${APP_VECTORSTORE_NPROBE:-16}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-local-nim}
    depends_on:
      milvus:
        condition: service_healthy
        required: true
      nemollm-inference:
        condition: service_healthy
        required: true
      nemollm-embedding:
        condition: service_healthy
        required: true
      ranking-ms:
        condition: service_healthy
        required: true

  structured-retriever:
    environment:
      APP_LLM_MODELNAME: ${APP_LLM_MODELNAME:-nvidia/nemotron-3-nano-30b-a3b}
      APP_LLM_SERVERURL: ${APP_LLM_SERVERURL:-nemollm-inference:8000}
      APP_EMBEDDINGS_MODELNAME: ${APP_EMBEDDINGS_MODELNAME:-nvidia/llama-nemotron-embed-1b-v2}
      APP_EMBEDDINGS_SERVERURL: ${APP_EMBEDDINGS_SERVERURL:-nemollm-embedding:8000}
      APP_VECTORSTORE_INDEXTYPE: ${APP_VECTORSTORE_INDEXTYPE:-GPU_IVF_FLAT}
      APP_VECTORSTORE_NLIST: ${APP_VECTORSTORE_NLIST:-64}
      APP_VECTORSTORE_NPROBE: ${APP_VECTORSTORE_NPROBE:-16}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-local-nim}
    depends_on:
      postgres:
        condition: service_healthy
        required: true
      milvus:
        condition: service_healthy
        required: true
      nemollm-inference:
        condition: service_healthy
        required: true
      nemollm-embedding:
        condition: service_healthy
        required: true

  pgadmin:
    user: ${USERID:-1000:1000}

  nemollm-inference:
    image: nvcr.io/nim/nvidia/nemotron-3-nano:${NEMOTRON3_NANO_NIM_TAG:-2.0.5}
    environment:
      NGC_API_KEY: ${NGC_API_KEY}
      NIM_SERVED_MODEL_NAME: ${APP_LLM_MODELNAME:-nvidia/nemotron-3-nano-30b-a3b}
    deploy:
      resources:
        reservations:
          devices: !override
            - driver: nvidia
              device_ids: ['${LLM_MS_GPU_ID:-0}']
              capabilities: [gpu]

  nemollm-embedding:
    image: nvcr.io/nim/nvidia/llama-nemotron-embed-1b-v2:${EMBEDDING_NIM_TAG:-1.13.0}
    deploy:
      resources:
        reservations:
          devices: !override
            - driver: nvidia
              device_ids: ['${EMBEDDING_MS_GPU_ID:-1}']
              capabilities: [gpu]

  ranking-ms:
    image: nvcr.io/nim/nvidia/llama-nemotron-rerank-1b-v2:${RANKING_NIM_TAG:-1.10.0}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health/ready"]
      interval: 10s
      timeout: 20s
      retries: 100
    deploy:
      resources:
        reservations:
          devices: !override
            - driver: nvidia
              device_ids: ['${RANKING_MS_GPU_ID:-1}']
              capabilities: [gpu]

  milvus:
    image: milvusdb/milvus:${MILVUS_GPU_TAG:-v2.4.15-gpu}
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9010
      KNOWHERE_GPU_MEM_POOL_SIZE: "${KNOWHERE_GPU_MEM_POOL_SIZE:-2048;4096}"
    deploy:
      resources:
        reservations:
          devices: !override
            - driver: nvidia
              device_ids: ['${MILVUS_GPU_ID:-1}']
              capabilities: [gpu]
